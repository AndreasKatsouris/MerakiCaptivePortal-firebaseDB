name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Runs BEFORE the build so a committed credential fails the PR without
      # first publishing a preview channel containing it.
      - name: Secret scan
        run: npm run security:scan
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{
            secrets.FIREBASE_SERVICE_ACCOUNT_MERAKICAPTIVEPORTAL_FIREBASEDB }}
          projectId: merakicaptiveportal-firebasedb
